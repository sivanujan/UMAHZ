name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: umahz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, intl, bcmath, gd, zip, exif, pcntl
          coverage: pcov
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^# DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^# DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^# DB_DATABASE=.*/DB_DATABASE=umahz_test/' .env
          sed -i 's/^# DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/^# DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=umahz_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i 's/^MAIL_MAILER=.*/MAIL_MAILER=array/' .env
          sed -i 's/^RESEND_API_KEY=.*/RESEND_API_KEY=dummy_resend_key/' .env
          sed -i 's/^SCRIBE_TRANSCRIPTION_DRIVER=.*/SCRIBE_TRANSCRIPTION_DRIVER=fake/' .env
          sed -i 's/^SCRIBE_DRAFTING_DRIVER=.*/SCRIBE_DRAFTING_DRIVER=fake/' .env
          sed -i 's/^ASSEMBLYAI_API_KEY=.*/ASSEMBLYAI_API_KEY=dummy_assemblyai_key/' .env
          sed -i 's/^OPENROUTER_API_KEY=.*/OPENROUTER_API_KEY=dummy_openrouter_key/' .env
          sed -i 's/^STRIPE_KEY=.*/STRIPE_KEY=pk_test_ci_placeholder/' .env
          sed -i 's/^STRIPE_SECRET=.*/STRIPE_SECRET=sk_test_ci_placeholder/' .env
          sed -i 's/^STRIPE_WEBHOOK_SECRET=.*/STRIPE_WEBHOOK_SECRET=whsec_ci_placeholder/' .env
          sed -i 's/^STRIPE_CONNECT_WEBHOOK_SECRET=.*/STRIPE_CONNECT_WEBHOOK_SECRET=whsec_connect_ci_placeholder/' .env
          php artisan key:generate --force

      - name: Run Database Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: umahz_test
          DB_USERNAME: postgres
          DB_PASSWORD: root

      - name: Run Tests with Coverage
        run: php artisan test --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: umahz_test
          DB_USERNAME: postgres
          DB_PASSWORD: root
          APP_ENV: testing
          MAIL_MAILER: array
          SCRIBE_TRANSCRIPTION_DRIVER: fake
          SCRIBE_DRAFTING_DRIVER: fake

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
          if-no-files-found: error

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

  security-checks:
    name: Dependency & Secret Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Composer Audit (High & Critical)
        run: composer audit --locked --ignore-severity=low --ignore-severity=medium --ignore-severity=info

      - name: Run NPM Audit (High & Critical)
        run: npm audit --audit-level=high

      - name: Secret Scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # TODO: Turn sonar.qualitygate.wait back to true once Quality Gate passes
          args: >
            -Dsonar.qualitygate.wait=false
