# Railway builds this with Nixpacks now, not the old Dockerfile (see
# Dockerfile.unused for why — a persistent Apache config-state problem on
# the platform that no amount of build-time fixing could reach). Nixpacks'
# own PHP provider auto-detects Laravel (composer.json + public/index.php)
# and handles composer install + serving itself — a stock nginx+php-fpm
# setup, not something we hand-roll — which is exactly the point: let the
# platform own the web server instead of us managing Apache by hand.
#
# The one thing the PHP provider won't do on its own is build the
# Inertia/Vite frontend, since that's a Node concern layered on top of a
# PHP app. This adds just that step, on top of the provider's own phases.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.build]
cmds = ["npm ci", "npm run build"]
